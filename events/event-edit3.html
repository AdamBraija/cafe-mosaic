<body align="center">
    <header>
        <h1>Edit Event</h1>
        <p>Modify the event details below and submit to update.</p>

    <br><br><br>
    <main style="height: 80vh;">
        <p><i>Please make sure all information is correct before submitting the event.</i></p>
        <form action="event-creat.php" method="post">
            <fieldset style="height: 70vh">
                <legend>Edit Event</legend>
                <div>
                    <label for="title">Title : </label>
                    <input type="text" name="title" id="title" required maxlength="40"
                    value="Music Festival">
                </div>
                <br><br>
                <div>
                    <label for="date">Date : </label>
                    <input type="date" name="date" id="date" value="2025-12-10">
                </div>
                <br><br>
                <div>
                    <label for="time">Time :</label>
                    <input type="time" name="time" id="time" value="18:00">
                </div>
                <br><br>
                <div>
                    <label for="local">Location :</label>
                    <input type="text" name="local" id="local" value="Parc de la Ligue Arabe, Casablanca">
                </div>
                <br><br>
                <div>
                    <label for="description">Description :</label><br>
                    <textarea name="description" id="description" maxlength="450" cols="40" rows="5">Celebrate music under the stars at Casablanca's biggest outdoor festival! Live performances, food trucks, and fun activities for all ages.</textarea>
                </div>
                <br><br>
                <input type="submit" value="Edit Event" disabled>
                <a href="events-list.html"><input type="button" value="Cancel"></a>
                <br><br><br><br>
            </fieldset>
        </form>
