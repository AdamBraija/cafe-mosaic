<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body align="center">
    <header>
        <h1>Create New Event</h1>
        <p>Fill out the form below to add a new event.</p>
        
        <hr>
    </header>
    <br><br><br>
    <main style="height: 80vh;">
        <p><i>Please make sure all information is correct before submitting the event.</i></p>
        <form action="event-creat.php" method="post">
            <fieldset style="height: 70vh">
                <legend>Create Event</legend>
                <div>
                    <label for="title">Title : </label>
                    <input type="text" name="title" id="ttle" placeholder="Enter event title" required maxlength="40">
                </div>
                <br><br>
                <div>
                    <label for="date">Date : </label>
                    <input type="date" name="date" id="date" ><small>Select date</small>
                </div>
                <br><br>
                <div>
                    <label for="time">Time :</label>
                    <input type="time" name="time" id="time"><small>Select time</small>
                </div>
                <br><br>
                <div>
                    <label for="local">Location :</label>
                    <input type="text" name="local" id="local" placeholder="Enter location" >
                </div>
                <br><br>
                <div>
                    <label for="description">Description :</label><br>
                    <textarea name="description" id="description" maxlength="450" placholder="Write a short description about the event" cols="40" rows="5"></textarea>
                </div>
                <br><br>
                <input type="submit" value="Create Event" disabled>
                <a href="events-list.html"><input type="button" value="Cancel"></a>
                <br><br><br><br>
            </fieldset>
        </form>
    </main>
